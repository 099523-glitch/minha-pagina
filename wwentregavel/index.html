<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lucky Burn — Member Login</title>
<style>
  :root{
    --green:#1e6b2e; --green-2:#2e9e45; --green-3:#3fb65a;
    --gold:#e6b53c; --orange:#f0a35e; --ink:#1d2a1d; --muted:#5a6e5a;
    --line:#dcebdc; --card:#ffffff; --shadow:0 14px 40px rgba(30,60,30,.16);
    --grad:linear-gradient(135deg,#1e6b2e 0%,#2e9e45 60%,#3fb65a 100%);
    --grad-gold:linear-gradient(135deg,#e6b53c 0%,#f0a35e 100%);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(900px 500px at 100% -10%, #d6f3d4 0%, transparent 55%),
      radial-gradient(800px 500px at -10% 110%, #ffeccb 0%, transparent 55%),
      linear-gradient(160deg,#163e1d 0%,#1e6b2e 55%,#2e9e45 100%);
  }
  .login-wrap{width:100%; max-width:420px;}
  .brand{display:flex; align-items:center; justify-content:center; gap:10px; color:#fff; font-weight:800; font-size:1.3rem; margin-bottom:18px;}
  .brand .dot{width:38px;height:38px;border-radius:50%; background:rgba(255,255,255,.16); display:flex;align-items:center;justify-content:center; font-size:1.3rem;}
  .card{
    background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:38px 32px; text-align:center;
  }
  .badge{display:inline-block; background:var(--grad-gold); color:#3d2a00; font-size:.68rem; font-weight:800;
    letter-spacing:1.2px; text-transform:uppercase; padding:6px 14px; border-radius:30px; margin-bottom:16px;}
  h1{font-size:1.55rem; color:var(--green); margin-bottom:6px;}
  .sub{color:var(--muted); font-size:.95rem; margin-bottom:26px;}
  form{text-align:left;}
  label{display:block; font-size:.82rem; font-weight:700; color:var(--green); margin:0 0 6px 2px; text-transform:uppercase; letter-spacing:.5px;}
  .inp{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; font-size:1rem;
    font-family:inherit; color:var(--ink); margin-bottom:16px; transition:border-color .15s, box-shadow .15s;
  }
  .inp:focus{outline:none; border-color:var(--green-2); box-shadow:0 0 0 4px rgba(46,158,69,.12);}
  .btn{
    width:100%; border:none; cursor:pointer; background:var(--grad); color:#fff; font-weight:800; font-size:1.05rem;
    padding:16px; border-radius:50px; box-shadow:0 10px 26px rgba(30,107,46,.3); transition:transform .15s, box-shadow .15s;
    margin-top:4px;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 16px 34px rgba(30,107,46,.36);}
  .hint{font-size:.82rem; color:var(--muted); margin-top:18px; line-height:1.5;}
  .err{color:#c0392b; font-size:.85rem; min-height:18px; margin:-6px 0 10px 2px; text-align:left;}
  .foot{text-align:center; color:rgba(255,255,255,.85); font-size:.78rem; margin-top:22px; line-height:1.6;}
  .lock{font-size:.8rem; color:var(--muted); margin-bottom:8px;}
  @media(max-width:460px){ .card{padding:30px 22px;} }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand"><span class="dot">🔥</span> Lucky Burn</div>
    <div class="card">
      <span class="badge">★ Members Area</span>
      <h1>Welcome Back</h1>
      <p class="sub">Log in with the email from your purchase to access your 30-Day Companion Guide.</p>
      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input class="inp" type="email" id="email" name="email" placeholder="you@email.com" autocomplete="email" autofocus />
        <div class="err" id="err"></div>
        <button class="btn" type="submit">Log In →</button>
      </form>
      <p class="hint">🔒 Use the email associated with your order. Access is instant.</p>
    </div>
    <p class="foot">Educational guide only. Results vary from person to person.<br>© 2026 Lucky Burn. All Rights Reserved.</p>
  </div>

<script>
  (function(){
    // If already "logged in", go straight to the guide.
    if(localStorage.getItem('lb_member')){ location.replace('guia.html'); return; }

    var form = document.getElementById('loginForm');
    var emailEl = document.getElementById('email');
    var err = document.getElementById('err');

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var email = (emailEl.value || '').trim();
      // Accepts any email — only checks it looks like one.
      if(!email || email.indexOf('@') < 1 || email.indexOf('.') < 0){
        err.textContent = 'Please enter a valid email address.';
        emailEl.focus();
        return;
      }
      err.textContent = '';
      localStorage.setItem('lb_member', email);
      location.href = 'guia.html';
    });
  })();
</script>
</body>
</html>
