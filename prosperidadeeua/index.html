    /* GERADOR DE AVATAR LOCAL (SVG inline, zero dependência)        */

    function makeAvatar(name, bg) {
      bg = bg || '#888888';
      var parts = String(name).trim().split(/\s+/);
      var initials = (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
      var svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">' +
          '<rect width="64" height="64" fill="' + bg + '"/>' +
          '<text x="50%" y="50%" dy=".1em" fill="#fff" font-family="Arial,Helvetica,sans-serif" ' +
            'font-size="28" font-weight="bold" text-anchor="middle" dominant-baseline="middle">' +
            initials +
          '</text>' +
        '</svg>';
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    /* Default avatar genérico (silhueta) */
    var DEFAULT_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">' +
        '<circle cx="32" cy="32" r="32" fill="#bdbdbd"/>' +
        '<circle cx="32" cy="26" r="10" fill="#fff"/>' +
        '<ellipse cx="32" cy="56" rx="18" ry="14" fill="#fff"/>' +
      '</svg>'
    );

    document.addEventListener("DOMContentLoaded", function () {

      /* ===== TIMESTAMP ===== */
      var span = document.getElementById('live-timestamp');
      if (span) {
        var now = new Date();
        var hours = now.getHours();
        var minutes = now.getMinutes().toString().padStart(2, '0');
        var ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        var month = (now.getMonth() + 1).toString().padStart(2, '0');
        var day = now.getDate().toString().padStart(2, '0');
        var year = now.getFullYear();
        span.textContent = 'Live at ' + hours + ':' + minutes + ' ' + ampm + ', ' + month + '/' + day + '/' + year + '.';
      }

      /* ===== PAGE TIMER (controla o chat) ===== */
      var pageStartTime = Date.now();
      var currentPageTime = 0;
      setInterval(function() {
        currentPageTime = (Date.now() - pageStartTime) / 1000;
      }, 500);

      /* ===== CHAT ===== */
      var chatMessages = document.getElementById('chatMessages');
      var chatInput = document.getElementById('chatInput');
      var emojiButton = document.getElementById('emojiButton');
      var emojiMenu = document.getElementById('emojiMenu');

      var scheduledMessages = [
        { time: 1,  user: 'Robert Peterson', text: 'May God bless you all! In the name of Jesus', avatar: makeAvatar('Robert Peterson','#4A90D9') },
        { time: 5,  user: 'Luciana Parker',  text: 'This broadcast changed my day... gratitude to everyone!', avatar: makeAvatar('Luciana Parker','#D97B4A') },

        { time: 12, user: 'Irene Newman',    text: 'Amen!', avatar: makeAvatar('Irene Newman','#E67E22') },
        { time: 15, user: 'Claudia Foster',  text: 'Amen!!', avatar: makeAvatar('Claudia Foster','#C0392B') },
        { time: 17, user: 'Gilbert Lima',    text: 'Wow, interesting an 800-year-old Prayer? It can only be from God himself', avatar: makeAvatar('Gilbert Lima','#2980B9') },
        { time: 19, user: 'Regina Celia',    text: 'Glory to You, Lord! We are ready', avatar: makeAvatar('Regina Celia','#1A6B3A') },
        { time: 23, user: 'Martha Johnson',  text: 'I just started watching... has anyone used this prayer already?', avatar: makeAvatar('Martha Johnson','#2C3E50') },
        { time: 24, user: 'Eliana Roberts',  text: 'Praying!', avatar: makeAvatar('Eliana Roberts','#9B59B6') },
        { time: 26, user: 'Support Team',    text: 'Yes, Marta! Thousands of people are already reporting healings, financial blessings, and family restoration through this 7-minute prayer of Saint Benedict.', avatar: makeAvatar('Support Team','#1A6B3A') },
        { time: 33, user: 'Joan Lima',       text: 'Amen, glory to God!', avatar: makeAvatar('Joan Lima','#7F8C8D') }
      ];

      function addMessage(user, text, avatar) {
        avatar = avatar || DEFAULT_AVATAR;
        var messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        var avatarImg = document.createElement('img');
        avatarImg.classList.add('avatar');
        avatarImg.src = avatar;
        avatarImg.loading = 'lazy';
        var contentDiv = document.createElement('div');
        var usernameSpan = document.createElement('span');
        usernameSpan.classList.add('username');
        usernameSpan.textContent = user;
        var textSpan = document.createElement('span');
        textSpan.classList.add('text');
        textSpan.textContent = text;
        contentDiv.appendChild(usernameSpan);
        contentDiv.appendChild(textSpan);
        messageDiv.appendChild(avatarImg);
        messageDiv.appendChild(contentDiv);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function checkScheduledMessages() {
        var elapsed = Math.floor(currentPageTime);
        scheduledMessages.forEach(function(msg) {
          if (elapsed >= msg.time && !msg.sent) {
            addMessage(msg.user, msg.text, msg.avatar);
            msg.sent = true;
          }
        });
        requestAnimationFrame(checkScheduledMessages);
      }
      requestAnimationFrame(checkScheduledMessages);

      chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && chatInput.value.trim() !== '') {
          addMessage('You', chatInput.value.trim());
          chatInput.value = '';

      });

      emojiButton.addEventListener('click', function() {
        emojiMenu.style.display = (emojiMenu.style.display === 'block') ? 'none' : 'block';

      emojiMenu.addEventListener('click', function(e) {
        if (e.target.tagName === 'SPAN') {
          chatInput.value += e.target.textContent;
          chatInput.focus();
          emojiMenu.style.display = 'none';

      var likeBtn = document.getElementById('like-btn');
      var dislikeBtn = document.getElementById('dislike-btn');
      var subscribed = false;

      subscribeBtn.addEventListener('click', function() {
        subscribed = !subscribed;
        subscribeBtn.innerText = subscribed ? 'Subscribed' : 'Subscribe';
        subscribeBtn.style.background = subscribed ? '#e5e5e5' : '#0f0f0f';
        subscribeBtn.style.color = subscribed ? '#0f0f0f' : '#ffffff';
      });

      var currentViewers = 55000;
      function updateViewers() {
        var change = Math.floor(Math.random() * 30) + 1;
        var dir = Math.random() < 0.6 ? 1 : -1;
        currentViewers = Math.min(60000, Math.max(50000, currentViewers + change * dir));
        var formatted = currentViewers.toLocaleString('pt-BR') + ' ';
        if (viewCounterDesktop) viewCounterDesktop.querySelector('.view-number').innerText = formatted;
        if (viewCounterMobile) viewCounterMobile.querySelector('.view-number').innerText = formatted;
      }
      updateViewers();
      setInterval(updateViewers, 3000);

      likeBtn.addEventListener('click', function() {
        likeBtn.querySelector('img').style.filter = 'invert(0%)';
        dislikeBtn.querySelector('img').style.filter = 'invert(60%)';

    function showNotification(index) {
      if (index >= notifications.length) return;
      var data = notifications[index];
      var el = document.createElement("div");
      el.classList.add("notification");
      el.innerHTML = '<img decoding="async" loading="lazy" src="' + data.img + '" alt=""><div><strong>' + data.name + '</strong><br>' + data.message + '</div>';
      document.body.appendChild(el);
      setTimeout(function() { el.style.opacity = "1"; el.style.transform = "translateX(0)"; }, 100);
      setTimeout(function() {
        el.style.opacity = "0";
        el.style.transform = "translateX(-100%)";
        setTimeout(function() { el.remove(); }, 500);
      }, 8000);
    }
