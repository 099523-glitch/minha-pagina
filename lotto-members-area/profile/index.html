<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/lotto-members-area/">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>LottoCash - My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/extra.css" />
    <link rel="stylesheet" href="header/header.css" />
    <script src="js/lucide.min.js"></script>
    <script src="js/progress.js"></script>
  </head>
  <body class="bg-[#F6F7FB] text-[#111111] antialiased" data-active="">
    <div class="flex min-h-screen bg-[#F6F7FB] pb-20 lg:pb-0">
      <aside id="site-sidebar" class="w-[260px] bg-white h-screen sticky top-0 border-r border-gray-100 flex flex-col hidden lg:flex"></aside>
      <main class="flex-1 w-full flex flex-col relative">
        <header id="site-header" class="w-full max-w-none h-[80px] bg-white border border-[#e6e6e6] flex items-center justify-between px-6 sticky top-0 z-40"></header>
        <div id="main-content-wrapper" class="p-[10px] flex-1 overflow-x-hidden w-full mx-auto" style="max-width: 1100px;">
<div class="space-y-6 pt-4">
  <div class="bg-white rounded-3xl p-6 md:p-8 shadow-[0px_0px_5px_0px_rgba(0,0,0,0.05)] border border-[#e6e6e6] flex items-center gap-5 animate-fade-in-up" style="animation-delay: 100ms;">
    <div class="w-20 h-20 rounded-full bg-gradient-btn text-white flex items-center justify-center shrink-0 shadow-md"><i data-lucide="user" class="w-9 h-9"></i></div>
    <div class="min-w-0">
      <h2 class="text-2xl font-bold text-gray-900 truncate" id="profile-email" style="font-family:'Archivo Narrow',sans-serif;">Member</h2>
      <span class="inline-block mt-1 text-[11px] font-black text-primary bg-red-50 border border-red-100 px-2.5 py-0.5 rounded-full uppercase tracking-wider">Basic Member</span>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 animate-fade-in-up" style="animation-delay: 200ms;">
    <div class="bg-white rounded-[24px] p-5 border border-[#e6e6e6] shadow-[0px_0px_5px_0px_rgba(0,0,0,0.05)]">
      <div class="flex items-center gap-2 text-gray-400 mb-1"><i data-lucide="trending-up" class="w-4 h-4"></i><span class="text-[11px] font-bold uppercase tracking-wider">Learning progress</span></div>
      <p class="font-numbers font-black text-3xl text-gray-900"><span id="stat-progress">0</span>%</p>
    </div>
    <div class="bg-white rounded-[24px] p-5 border border-[#e6e6e6] shadow-[0px_0px_5px_0px_rgba(0,0,0,0.05)]">
      <div class="flex items-center gap-2 text-gray-400 mb-1"><i data-lucide="calendar-days" class="w-4 h-4"></i><span class="text-[11px] font-bold uppercase tracking-wider">Member for</span></div>
      <p class="font-numbers font-black text-3xl text-gray-900"><span id="stat-days">0</span> <span class="text-lg text-gray-400">days</span></p>
    </div>
    <div class="bg-white rounded-[24px] p-5 border border-[#e6e6e6] shadow-[0px_0px_5px_0px_rgba(0,0,0,0.05)]">
      <div class="flex items-center gap-2 text-gray-400 mb-1"><i data-lucide="gift" class="w-4 h-4"></i><span class="text-[11px] font-bold uppercase tracking-wider">Rewards unlocked</span></div>
      <p class="font-numbers font-black text-3xl text-gray-900"><span id="stat-rewards">0</span> <span class="text-lg text-gray-400">/ 2</span></p>
    </div>
  </div>

  <div class="bg-white rounded-[24px] border border-[#e6e6e6] shadow-[0px_0px_5px_0px_rgba(0,0,0,0.05)] overflow-hidden animate-fade-in-up" style="animation-delay: 300ms;">
    <div class="px-5 py-4 border-b border-[#e6e6e6]"><h3 class="archivo-title tracking-tight text-gray-900">Account</h3></div>
    <div class="divide-y divide-[#f0f0f0]">
      <a href="home/" class="flex items-center gap-4 p-5 hover:bg-gray-50 transition-colors"><i data-lucide="home" class="w-5 h-5 text-primary"></i><span class="font-semibold text-gray-800">Back to Home</span><i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 ml-auto"></i></a>
      <a href="assistance/" class="flex items-center gap-4 p-5 hover:bg-gray-50 transition-colors"><i data-lucide="headset" class="w-5 h-5 text-primary"></i><span class="font-semibold text-gray-800">Contact support</span><i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 ml-auto"></i></a>
      <a href="how-to-use/" class="flex items-center gap-4 p-5 hover:bg-gray-50 transition-colors"><i data-lucide="help-circle" class="w-5 h-5 text-primary"></i><span class="font-semibold text-gray-800">How to use LottoCash</span><i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 ml-auto"></i></a>
      <a href="#" data-logout class="flex items-center gap-4 p-5 hover:bg-red-50 transition-colors"><i data-lucide="log-out" class="w-5 h-5 text-primary"></i><span class="font-semibold text-primary">Log out</span></a>
    </div>
  </div>
</div>
        </div>
      </main>
      <div id="site-mobile-nav" class="lg:hidden fixed bottom-0 left-0 right-0 h-[80px] bg-white shadow-[0_-8px_30px_rgba(0,0,0,0.06)] z-50 overflow-hidden pb-[env(safe-area-inset-bottom,4px)]"></div>
      <div id="site-modals"></div>
    </div>
    <script src="js/site.js"></script>
    <script src="header/header.js"></script>
    <script>
      LCProgress.init();
      document.addEventListener('DOMContentLoaded', function () {
        var email = localStorage.getItem('member_email');
        if (email) document.getElementById('profile-email').textContent = email;
        if (window.LCProgress) {
          var r = window.LCProgress.compute();
          document.getElementById('stat-progress').textContent = r.percent;
          document.getElementById('stat-days').textContent = r.daysSince;
          document.getElementById('stat-rewards').textContent = (r.cashbackUnlocked ? 1 : 0) + (r.drawUnlocked ? 1 : 0);
        }
      });
    </script>
  </body>
</html>
