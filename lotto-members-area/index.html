<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/lotto-members-area/">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>Lotto - Secure Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/lucide.min.js"></script>
    <script src="js/progress.js"></script>
  </head>
  <body class="bg-white min-h-screen antialiased font-sans flex items-center justify-center relative py-8 overflow-y-auto">

    <div class="w-full max-w-[380px] p-2 relative z-10 animate-in fade-in zoom-in-95 duration-500">

      <div class="bg-white border border-[#e6e6e6] rounded-[28px] shadow-[0_12px_40px_rgba(0,0,0,0.06)] overflow-hidden">

        <div class="bg-white px-8 pt-8 pb-0 flex flex-col items-center border-b border-gray-50">
          <img src="images/logo.png" alt="Lotto" style="height: 90px;" class="object-contain" />
        </div>

        <div class="px-8 pt-5 pb-8 space-y-5">
          <h1 class="text-2xl font-black text-gray-900 tracking-tight text-center" style="font-family: 'Archivo Narrow', sans-serif;">Member Login</h1>

          <form id="login-form" novalidate class="space-y-4">
            <div class="space-y-1.5">
              <label for="email" class="text-[13px] font-bold text-gray-700 uppercase tracking-wide">Username or Email</label>
              <div class="relative">
                <i data-lucide="mail" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input
                  type="email"
                  name="email"
                  id="email"
                  placeholder="name@example.com"
                  class="w-full bg-gray-50 h-[52px] pl-12 pr-4 rounded-[16px] border border-gray-200 focus:outline-none focus:border-primary focus:bg-white transition-all text-sm font-medium text-gray-900 shadow-sm"
                />
              </div>
            </div>

            <div class="space-y-1.5">
              <label for="password" class="text-[13px] font-bold text-gray-700 uppercase tracking-wide">Password</label>
              <div class="relative">
                <i data-lucide="lock" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input
                  type="password"
                  name="password"
                  id="password"
                  placeholder="••••••••"
                  class="w-full bg-gray-50 h-[52px] pl-12 pr-12 rounded-[16px] border border-gray-200 focus:outline-none focus:border-primary focus:bg-white transition-all text-sm font-medium text-gray-900 shadow-sm"
                />
                <button
                  type="button"
                  id="toggle-password"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer"
                >
                  <i data-lucide="eye" class="w-5 h-5" id="eye-icon"></i>
                </button>
              </div>
            </div>

            <div class="bg-[#fffdf9] border border-[#f5ebdb] p-4.5 rounded-[18px] shadow-[0_4px_20px_rgba(245,235,219,0.25)] space-y-3 my-2">
              <div>
                <span class="inline-block bg-[#fef7e7] border border-[#f5dca2] text-[#c27a23] font-black text-[10px] tracking-widest uppercase px-2.5 py-0.5 rounded-[6px]">
                  IMPORTANT
                </span>
              </div>

              <div class="text-[13px] text-[#5c564c] font-medium leading-relaxed space-y-2.5">
                <p class="m-0">
                  Your login is the <strong class="text-[#a86518] font-bold">email</strong> you used for the purchase.
                </p>
                <div class="border-t border-[#f5ebdb]/70 my-1"></div>
                <p class="m-0">
                  Your <strong class="text-[#a86518] font-bold">password</strong> is: <strong class="text-[#a86518] font-bold font-mono">12345</strong> (unless you have made a change).
                </p>
              </div>
            </div>

            <div class="pt-2">
              <button
                type="submit"
                class="w-full bg-gradient-btn text-white font-bold tracking-wide py-3.5 rounded-[14px] text-sm flex items-center justify-center gap-2 hover:scale-[1.02] active:scale-95 transition-all shadow-[0_4px_14px_rgba(255,0,0,0.2)]"
              >
                Login
                <i data-lucide="log-in" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="text-center pt-1">
              <a href="mailto:americansystem.support@gmail.com?subject=Password%20reset%20request" class="text-[14px] font-bold text-primary hover:underline">Forgot Password?</a>
            </div>

          </form>
        </div>
      </div>

      <div class="bg-white border border-[#e6e6e6] p-5 rounded-[24px] shadow-[0_12px_40px_rgba(0,0,0,0.04)] mt-4 flex flex-col gap-3">
        <div class="space-y-1">
          <div class="flex items-center gap-2 text-gray-900 font-bold justify-center text-[15px]">
            <i data-lucide="mail" class="w-5 h-5 text-primary"></i>
            Email Support
          </div>
          <p class="text-xs text-gray-500 text-center leading-normal">Send us an email and we will get back to you as soon as possible.</p>
        </div>
        <a href="mailto:americansystem.support@gmail.com" class="flex items-center justify-center gap-2 bg-gradient-btn-blue text-white text-xs font-bold py-3 px-5 rounded-[12px] hover:scale-[1.02] active:scale-95 transition-all shadow-sm">
          <i data-lucide="mail" class="w-4 h-4"></i>
          americansystem.support@gmail.com
        </a>
      </div>

    </div>

    <script>
      lucide.createIcons();

      document.getElementById('toggle-password').addEventListener('click', function() {
          const passwordInput = document.getElementById('password');
          const eyeIcon = document.getElementById('eye-icon');
          if (passwordInput.type === 'password') {
              passwordInput.type = 'text';
              eyeIcon.setAttribute('data-lucide', 'eye-off');
          } else {
              passwordInput.type = 'password';
              eyeIcon.setAttribute('data-lucide', 'eye');
          }
          lucide.createIcons();
      });

      document.getElementById('login-form').addEventListener('submit', function (e) {
          e.preventDefault();
          var email = document.getElementById('email').value.trim();
          if (email) {
              localStorage.setItem('member_email', email);
          }
          if (window.LCProgress) window.LCProgress.markStep('login');
          window.location.href = 'home/';
      });
    </script>
  </body>
</html>
