            '<span class="fb-elapsed" id="elapsed">00:00</span>' +
          '</div>' +
        '</div>' +
        '<button class="fb-follow">Follow</button>' +
      '</header>' +
      '<div class="video-outer"><div class="video-wrap">' +
        '<div class="video-inner" id="videoInner"></div>' +
        '<div class="video-live-tag">● LIVE</div>' +
        '<div class="video-viewers-tag" id="viewersTag">👁 1,247 watching</div>' +
        '<div class="like-pops" id="likePops"></div>' +
      '</div></div>' +
      '<div class="fb-reactions">' +
        '<button class="fb-react-btn" id="likeBtn">🤍 <span id="likeCount">4,823</span></button>' +
        '<button class="fb-react-btn">💬 <span id="commentCount">312</span></button>' +
        '<button class="fb-react-btn">🔗 Share</button>' +
      '</div>' +
      '<div id="dynamic"></div>' +
    '</div>';

  /* video player: montado uma unica vez a partir do <template id="vslEmbed"> */
  (function mountPlayer() {
    var host = document.getElementById("videoInner");
    var tpl  = document.getElementById("vslEmbed");
    if (tpl && tpl.content) host.appendChild(tpl.content.cloneNode(true));

    /* script que veio dentro do <template> so executa se for recriado */
    host.querySelectorAll("script").forEach(function (old) {
      var s = document.createElement("script");
      if (old.src)  s.src  = old.src;
      if (old.type) s.type = old.type;
      s.async = false;
      if (old.textContent) s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });

    /* nada colado ainda -> desenha o marcador do espaco da VSL */
    if (!host.querySelector('video, iframe, vturb-smartplayer, [id^="vid-"]')) {
      host.insertAdjacentHTML("afterbegin",
        '<div class="vsl-placeholder">ESPACO DA SUA VSL' +
        '<span>cole o embed do VTurb no &lt;template id="vslEmbed"&gt; no topo do &lt;body&gt;</span></div>');
    }
  })();

  var elViewers = document.getElementById("viewers");
  var elViewersTag = document.getElementById("viewersTag");
  var elElapsed = document.getElementById("elapsed");
  var elLikeBtn = document.getElementById("likeBtn");
  var elLikeCount = document.getElementById("likeCount");
  var elCommentCount = document.getElementById("commentCount");
  var elLikePops = document.getElementById("likePops");
  var elDynamic = document.getElementById("dynamic");

  function fmtNum(n) { return n.toLocaleString("en-US"); }
  function fmtTime(n) {
    var m = String(Math.floor(n / 60)).padStart(2, "0");
    var s = String(n % 60).padStart(2, "0");
    return m + ":" + s;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function renderHeaderNums() {
    elViewers.textContent = "👁 " + fmtNum(st.viewers);
    elViewersTag.textContent = "👁 " + fmtNum(st.viewers) + " watching";
    elElapsed.textContent = fmtTime(st.elapsed);
    elLikeCount.textContent = fmtNum(st.likes);
    elCommentCount.textContent = fmtNum(st.commentCount);
    elLikeBtn.className = "fb-react-btn" + (st.liked ? " liked" : "");
    elLikeBtn.firstChild.nodeValue = (st.liked ? "❤️" : "🤍") + " ";
  }

  function renderPops() {
    var html = "";
    st.likePops.forEach(function (t) {
      html += '<div class="like-pop"><img class="lp-avatar" src="' + t.photo + '" alt="">' +
              '<div class="lp-text"><strong>' + esc(t.name) + '</strong> liked ❤️</div></div>';
    });
    st.purchasePops.forEach(function (t) {
      var msg = PURCHASE_MSG[(t.id - 1) % PURCHASE_MSG.length];
      html += '<div class="like-pop purchase-pop"><img class="lp-avatar" src="' + t.photo + '" alt="">' +
              '<div class="lp-text"><strong>' + esc(t.name) + '</strong> ' + esc(msg) + '</div></div>';
    });
    elLikePops.innerHTML = html;
  }

  function commentsBlockHTML() {
    var rows = st.comments.map(function (t) {
      return '<div class="live-comment"><img class="lc-avatar" src="' + t.photo + '" alt="">' +
             '<div class="lc-body"><span class="lc-name">' + esc(t.name) + '</span>' +
             '<span class="lc-text">' + esc(t.text) + '</span></div></div>';
    }).join("");
    return '<div class="delay-block"><div class="live-comments">' + rows + '</div>' +
           '<div class="comment-input"><input placeholder="Write a comment…" disabled><span>😊</span></div></div>';
  }

  function offersBlockHTML() {
    var offers = OFFERS.map(function (o) {
      return '<a href="' + o.url + '" target="_blank" rel="noopener noreferrer" class="offer-btn' + (o.highlight ? " highlight" : "") + '" data-url="' + o.url + '">' +
        (o.badge ? '<span class="offer-badge">⭐ ' + esc(o.badge) + '</span>' : "") +
        '<div class="offer-row"><div class="offer-left">' +
          '<div class="offer-label">' + esc(o.label) + '</div>' +
          '<div class="offer-price">$' + o.price + '</div>' +
        '</div><div class="offer-cta">CHOOSE OFFER<span class="offer-arrow">→</span></div></div></a>';
    }).join("");

    var testis = TESTIMONIALS.map(function (t) {
      return '<div class="testi"><div class="testi-head">' +
        '<img src="' + t.photo + '" alt="' + esc(t.name) + '">' +
        '<div><div class="testi-name">' + esc(t.name) + '</div><div class="testi-loc">' + esc(t.location) + '</div></div>' +
        '<div class="testi-amount">Sent $' + t.amount + '</div></div>' +
        '<div class="stars">★★★★★</div>' +
        '<div class="testi-text">"' + esc(t.text) + '"</div></div>';
    }).join("");

    return '<div class="offers smartplayer-scroll-event">' +
      offers +
      '<div class="offers-foot">🔒 Secure checkout · 60-day guarantee</div>' +
      '<div class="testimonials">' +
        '<div class="testi-title">💬 What People Are Saying</div>' +
        '<div class="testi-sub">Real stories from people who sent their seed during the live</div>' +
        testis +
      '</div>' +
      '<div class="faq">' +
        '<div class="faq-title">Frequently Asked Questions</div>' +
        '<details class="faq-item"><summary>🛡️ Is there a money-back guarantee?</summary><p>Yes. Every offer includes a full <strong>60-day money-back guarantee</strong>. If you\'re not satisfied for any reason, simply email our support team and receive a 100% refund — no questions asked.</p></details>' +
        '<details class="faq-item"><summary>🎁 How do I receive my bonuses?</summary><p>All bonuses are delivered <strong>instantly by email</strong> right after your purchase is confirmed. Please check your inbox (and spam folder) for the confirmation message with your access links.</p></details>' +
        '<details class="faq-item"><summary>✨ How quickly will I see results?</summary><p>Most people report their <strong>first miracles within 2 days</strong> of following the practice. Faith and consistency amplify the effect — many members experience answers to prayer even sooner.</p></details>' +
        '<details class="faq-item"><summary>🔒 Is my payment safe and secure?</summary><p>Absolutely. All payments are processed through <strong>Digistore24</strong>, one of the world\'s most trusted checkout platforms. Your data is protected by <strong>256-bit SSL encryption</strong> — the same standard used by major banks.</p></details>' +
        '<details class="faq-item"><summary>💳 What payment methods are accepted?</summary><p>We accept all major credit and debit cards (Visa, Mastercard, American Express), PayPal, and other secure local payment methods depending on your country.</p></details>' +
        '<details class="faq-item"><summary>📩 Who do I contact if I need help?</summary><p>Our support team is available 7 days a week. You\'ll receive a direct support email in your order confirmation and every reply is answered within 24 hours.</p></details>' +
        '<div class="trust-badges"><span>🔒 256-bit SSL</span><span>✅ 60-day guarantee</span><span>💳 Secure checkout</span><span>⭐ 4.9/5 rating</span></div>' +
      '</div>' +
    '</div>';
  }

  function renderDynamic() {
    var showOffers = FORCE_OFFERS || st.videoTime >= X;
    if (showOffers) {
      if (!st.offersShown) { elDynamic.innerHTML = offersBlockHTML(); st.offersShown = true; wireOffers(); }
    } else {
      elDynamic.innerHTML = commentsBlockHTML();
      var feed = elDynamic.querySelector(".live-comments");
      if (feed) feed.scrollTop = feed.scrollHeight;
    }
  }

  /* botao -> checkout direto, so carimbando subid + params de afiliado */
  function wireOffers() {
    elDynamic.querySelectorAll(".offer-btn").forEach(function (a) {
      try { a.href = withSubid(withAffiliate(a.getAttribute("data-url"))); } catch (e) {}
    });
  }

  /* ================= EFFECTS (same delays as the original) ================= */

  /* elapsed +1s */
  setInterval(function () { st.elapsed += 1; elElapsed.textContent = fmtTime(st.elapsed); }, 1000);

  /* video currentTime poll, every 500ms */
  setInterval(function () {
    var t = null;
    try {
      var f = window.smartplayer && window.smartplayer.instances && window.smartplayer.instances[0] &&
              window.smartplayer.instances[0].video && window.smartplayer.instances[0].video.currentTime;
      if (typeof f === "number" && !isNaN(f)) t = f;
      else {
        var v = document.getElementById("videoInner").querySelector("video");
        if (v && !isNaN(v.currentTime)) t = v.currentTime;
      }
    } catch (e) {}
    if (t !== null) {
      var was = st.videoTime;
      st.videoTime = t;
      if ((was >= X) !== (t >= X)) renderDynamic();
      if ((was >= Y) !== (t >= Y)) togglePurchasePops(t >= Y);
    }
  }, 500);

  /* viewers random walk, every 6000ms */
  setInterval(function () {
    st.viewers = Math.max(800, st.viewers + Math.floor(Math.random() * 21) - 8);
    elViewers.textContent = "👁 " + fmtNum(st.viewers);
    elViewersTag.textContent = "👁 " + fmtNum(st.viewers) + " watching";
  }, 6000);

  /* live comments: 3 quick ones at 0/600/1200ms, then every 4500-7000ms */
  function addComment() {
    var text = COMMENTS[Math.floor(Math.random() * COMMENTS.length)];
    var color = COLORS[Math.floor(Math.random() * COLORS.length)];
    nComment += 1;
    var p = person(nComment);
    st.comments = st.comments.slice(-5).concat([{ id: nComment, name: p.name, text: text, color: color, initials: p.initials, photo: p.photo }]);
    st.commentCount += 1 + Math.floor(Math.random() * 3);
    elCommentCount.textContent = fmtNum(st.commentCount);
    if (st.videoTime < X) renderDynamic();
  }
  for (var ci = 0; ci < 3; ci++) setTimeout(addComment, ci * 600);
  setInterval(addComment, 4500 + Math.random() * 2500);

  /* likes auto-increment, every 8000-12000ms */
  setInterval(function () {
    st.likes += Math.floor(Math.random() * 8) + 2;
    elLikeCount.textContent = fmtNum(st.likes);
  }, 8000 + Math.random() * 4000);

  /* like-pops: first at 8000ms, then every 35000-45000ms; each also +1 like */
  function addLikePop() {
    nLikePop += 1;
    var p = person(nLikePop);
    var item = { id: nLikePop, name: p.name, photo: p.photo };
    st.likePops = st.likePops.concat([item]);
    st.likes += 1;
    elLikeCount.textContent = fmtNum(st.likes);
    renderPops();
    setTimeout(function () {
      st.likePops = st.likePops.filter(function (x) { return x.id !== item.id; });
      renderPops();
    }, 4500);
  }
  setTimeout(addLikePop, 8000);
  setInterval(addLikePop, 35000 + Math.random() * 10000);

  /* purchase-pops: only while video time >= 230s, every 4000ms */
  var purchaseTimer = null;
  function togglePurchasePops(on) {
    if (on && !purchaseTimer) {
      purchaseTimer = setInterval(function () {
        nPurchase += 1;
        var p = person(nPurchase);
        var item = { id: nPurchase, name: p.name, photo: p.photo };
        st.purchasePops = st.purchasePops.concat([item]);
        renderPops();
        setTimeout(function () {
          st.purchasePops = st.purchasePops.filter(function (x) { return x.id !== item.id; });
          renderPops();
        }, 4500);
      }, 4000);
    } else if (!on && purchaseTimer) {
      clearInterval(purchaseTimer); purchaseTimer = null;
      st.purchasePops = []; renderPops();
    }
  }

  /* back-button trap: pushes 3 history entries, sends Back to /wait?<same query>
     (verbatim from the original). Needs a /wait page on your host. */
  (function backTrap() {
    var target = window.location.origin + "/wait";
    var q = window.location.search.replace("?", "");
    var dest = target + (target.indexOf("?") > 0 ? "&" : "?") + q;
    history.pushState({}, "", location.href);
    history.pushState({}, "", location.href);
    history.pushState({}, "", location.href);
    window.addEventListener("popstate", function () { setTimeout(function () { location.href = dest; }, 1); });
  })();

  /* like button */
  elLikeBtn.addEventListener("click", function () {
    var was = st.liked;
    st.liked = !st.liked;
    st.likes += was ? -1 : 1;
    renderHeaderNums();
  });

  /* first paint */
  renderHeaderNums();
  renderDynamic();
  if (FORCE_OFFERS || st.videoTime >= Y) togglePurchasePops(true);
})();
</script>
</body>
</html>
