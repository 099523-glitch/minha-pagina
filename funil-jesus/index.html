<script>
const chatBody = document.getElementById('chatBody');

const names = ['SARAH M.','DAVID B.','EMMA R.','MICHAEL T.','CHLOE S.','LISA P.','JAMES B.','MARK R.'];
const messages = [
  "Praise the Lord! 🙏",
  "This changes everything...",
  "Watching from Texas! 🤠",
  "God bless everyone watching.",
  "Fascinating discovery!",
  "This is truly a historical moment.",
  "Amen 🙏",
  "Wow, powerful prayer!"
];
const colors = ['#e91e63','#9c27b0','#3f51b5','#2196f3','#009688','#4caf50','#ff9800','#f44336','#607d8b','#00bcd4'];

function randomColor(){ return colors[Math.floor(Math.random()*colors.length)]; }
function randomName(){ return names[Math.floor(Math.random()*names.length)]; }
function randomMsg(){ return messages[Math.floor(Math.random()*messages.length)]; }
function getInitials(name){
  const parts = name.split(' ');
  return parts.length > 1 ? parts[0].charAt(0) + parts[1].charAt(0) : parts[0].charAt(0);
}

function createMessage(author, text, time = "Just now", specificColor = null){
  const div = document.createElement('div');
  div.className = 'msg';
  const bgColor = specificColor ? specificColor : randomColor();
  div.innerHTML = `<div class="pfp" style="background:${bgColor}">${getInitials(author)}</div>
    <div style="flex: 1;">
      <div class="author">${author}</div>
      <div class="text">${text}</div>
      <div class="time">${time}</div>
    </div>`;
  chatBody.appendChild(div);
  chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
}

// Pre-load specific messages
createMessage('TOM W.', 'Just joined. What did I miss? 😮', '4 min ago', '#ff9800');
createMessage('MARIA L.', 'Never seen anything like this before. Sharing with everyone!', '3 min ago', '#9c27b0');
createMessage('ROB K.', 'Breaking news right here, stay tuned everyone 👀', '2 min ago', '#4caf50');
createMessage('ASHLEY K.', 'Watching live from the UK 🇬🇧 Amazing content!', '1 min ago', '#2196f3');
createMessage('JOHN DOE', "This is incredible, I can't believe what I'm seeing! 🔥", 'Just now', '#f44336');

// Auto-looping new messages
function loopChat(){
  createMessage(randomName(), randomMsg(), "Just now");
  while (chatBody.children.length > 40) chatBody.removeChild(chatBody.firstChild);
  setTimeout(loopChat, 2500 + Math.random() * 3500);
}

// Update stream timer dynamically
let streamingMinutes = 27;
setInterval(() => {
  streamingMinutes++;
  document.getElementById('meta').textContent = `21,855 watching now • Started streaming ${streamingMinutes} minutes ago`;
}, 60000);

// Manual chat input
const input = document.getElementById('chatInput');
function sendMessage(){
  const t = input.value.trim();
  if (!t) return;
  createMessage('You', t.replace(/</g,'&lt;').replace(/>/g,'&gt;'), 'Just now', '#607d8b');
  input.value = '';
}
document.getElementById('sendBtn').addEventListener('click', sendMessage);
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

setTimeout(loopChat, 4000);
</script>
