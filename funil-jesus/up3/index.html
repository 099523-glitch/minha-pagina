<script>
(function () {
  /* repassa os parametros da URL (session id etc.) pra todo link da Digistore */
  function passQuery(root) {
    var qs = location.search;
    if (!qs || qs === '?') return;
    var params = new URLSearchParams(qs);
    (root || document).querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href') || '';
      if (href.indexOf('digistore24') < 0 && href.indexOf('checkout-ds24') < 0) return;
      try {
        var u = new URL(href, location.origin);
        params.forEach(function (v, k) { if (!u.searchParams.has(k)) u.searchParams.set(k, v); });
        if (u.toString() !== href) a.setAttribute('href', u.toString());
      } catch (e) {}
    });
  }
  window.__dsPassQuery = passQuery;
  document.addEventListener('DOMContentLoaded', function () {
    passQuery();
    var s = document.createElement('script');
    s.src = 'https://www.digistore24-scripts.com/service/digistore.js';
    s.async = true; s.dataset.digistore = 'upsell';
    s.onload = function () { try { if (typeof window.digistoreUpsell === 'function') window.digistoreUpsell(); } catch (e) {} passQuery(); };
    document.body.appendChild(s);
  });
})();
</script>

<script>

  /* Monta o link de resposta no formato final que o digistore.js usa:
     answer/<session_id>/yes|no + parametros da URL. Sem session id (teste
     direto, sem vir do checkout) cai no formato simples. */
  function dsAnswer(kind) {
    var params = new URLSearchParams(location.search);
    var sid = params.get('digistore_upsell_session_id');
    var base = 'https://www.checkout-ds24.com/answer/' + (sid ? sid + '/' : '') + kind;
    var u = new URL(base);
    if (kind === 'yes') u.searchParams.set('template', 'light');
    params.forEach(function (v, k) { if (!u.searchParams.has(k)) u.searchParams.set(k, v); });
    return u.toString();
  }
  var YES_URL = dsAnswer('yes'), NO_URL = dsAnswer('no');
  var MAX_TYPING_MS = 2600, BASE_MS = 900, PER_CHAR_MS = 18;   // ritmo do original
  /* ========================================== */

  var SCRIPT = [
    { kind: 'say', text: 'How good it is to see you again, My child. 🙏' },

    { kind: 'ask', options: ['I am here, Lord 🙏', 'I am listening ❤️', 'Speak to my heart'] },

  ];

  var thread = document.getElementById('thread'), typing = document.getElementById('typing'),
      anchor = document.getElementById('anchor'), replies = document.getElementById('replies'),
      replyList = document.getElementById('replyList');
  var idx = 0;

  function bubble(text, me) {
    var row = document.createElement('div'); row.className = 'icc__row' + (me ? ' icc__row--me' : '');
    var b = document.createElement('div'); b.className = 'icc__bubble'; b.textContent = text; row.appendChild(b);
    thread.insertBefore(row, typing);
    anchor.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  function next() {
    var step = SCRIPT[idx];
    if (!step) return;
    if (step.kind === 'say') {
      typing.hidden = false; replies.hidden = true;
      anchor.scrollIntoView({ behavior: 'smooth', block: 'end' });
      setTimeout(function () { typing.hidden = true; bubble(step.text, false); idx++; next(); },
        Math.min(MAX_TYPING_MS, BASE_MS + step.text.length * PER_CHAR_MS));
    } else {
      typing.hidden = true;
      replyList.innerHTML = '';
      step.options.forEach(function (opt) {
        var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'icc__reply'; btn.textContent = opt;
        btn.addEventListener('click', function () { answer(opt); });
        replyList.appendChild(btn);

      replies.hidden = false;
      anchor.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
  }
  function answer(text) {
